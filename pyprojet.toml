[project]
name = "clasificacion-melanoma"
version = "0.2.0"
description = "Clasificación asistida de melanoma vs. nevo en imágenes dermatoscópicas (HAM10000) con baseline OpenCV y ResNet18."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Andres Bidone" }]
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "pillow==13.0.0",
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = [
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "opencv-python==5.0.0.93",
    "matplotlib==3.11.2",
    "tqdm==4.70.1",
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = []