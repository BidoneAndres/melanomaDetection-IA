[project]
name = "clasificacion-melanoma"
version = "0.2.0"
description = "Clasificación asistida de melanoma vs. nevo en imágenes dermatoscópicas (HAM10000) con baseline OpenCV y ResNet18."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Andres Bidone" }]
dependencies = [
    "torch==2.15.0+cpu",
    "torchvision==0.29.2+cpu",
    "numpy==2.4.6",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "opencv-python-headless==5.0.0.93",
    "matplotlib==3.11.2",
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
    "tqdm==4.70.1",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }